name: Corporate DevSecOps Gate

run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'redeploy-environment' && format('Env redeploy · {0} · {1}', inputs.vercel_project_name, inputs.request_id) || github.event.head_commit.message || github.workflow }}

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      operation:
        description: Operacion manual autorizada
        required: true
        default: security-scan
        type: choice
        options:
          - security-scan
          - redeploy-environment
      vercel_project_id:
        description: Project ID de Vercel para redeploy
        required: false
        type: string
      vercel_project_name:
        description: Nombre exacto del proyecto y repositorio
        required: false
        type: string
      request_id:
        description: Identificador de correlacion generado por la consola
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: security-gate-${{ github.ref }}-${{ github.event_name }}-${{ inputs.operation || 'code' }}
  cancel-in-progress: true

jobs:
  preflight:
    name: 1. Preflight y cambios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation != 'redeploy-environment' }}
    outputs:
      app_changed: ${{ steps.app_changes.outputs.changed }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bloquear archivos sensibles versionados
        shell: bash
        run: bash .github/devsecops/scripts/block-sensitive-files.sh

      - name: Detectar cambios de aplicacion
        id: app_changes
        shell: bash
        run: bash .github/devsecops/scripts/detect-app-changes.sh

  secrets_scan:
    name: 2. Secretos hardcodeados
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar reglas corporativas de secretos (Estricto / Multi-idioma)
        shell: bash
        run: bash .github/devsecops/scripts/prepare-gitleaks-config.sh

      - name: Escaneo de secretos hardcodeados (Gitleaks CLI)
        shell: bash
        env:
          WORKSPACE_PATH: ${{ github.workspace }}
        run: |
          docker run --rm \
            -v "$WORKSPACE_PATH:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git . --config .gitleaks-ci.toml --redact --verbose --exit-code 1

  sast_scan:
    name: 3. SAST Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: secrets_scan

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python para Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analisis estatico de seguridad (Semgrep SAST)
        shell: bash
        run: |
          python -m pip install --upgrade pipx
          pipx install semgrep
          semgrep scan \
            --config p/default \
            --config p/security-audit \
            --config p/secrets \
            --config p/javascript \
            --config p/nodejs \
            --exclude ".github/**" \
            --exclude "node_modules/**" \
            --exclude "dist/**" \
            --exclude ".vercel/**" \
            --error \
            --metrics=off

  node_quality:
    name: 4. Node.js SCA y calidad
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: sast_scan

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar sintaxis JavaScript
        shell: bash
        run: bash .github/devsecops/scripts/validate-js.sh

      - name: Auditoria de dependencias Node.js en Subcarpetas (SCA)
        shell: bash
        run: bash .github/devsecops/scripts/audit-node-deps.sh

      - name: Detectar dependencias no utilizadas en Subcarpetas
        shell: bash
        run: bash .github/devsecops/scripts/detect-unused-deps.sh

  rollback:
    name: 5. Rollback automatico
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - preflight
      - secrets_scan
      - sast_scan
      - node_quality
    if: ${{ always() && github.event_name == 'push' && contains(join(needs.*.result, ','), 'failure') }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rollback automatico en main
        shell: bash
        env:
          SHA_TO_REVERT: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: bash .github/devsecops/scripts/rollback.sh

  vercel_provision:
    name: 6. Vercel proyecto
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - preflight
      - node_quality
    if: ${{ success() && github.event_name == 'push' && needs.preflight.outputs.app_changed == 'true' }}
    outputs:
      project_id: ${{ steps.vercel_provisioning.outputs.project_id }}
      project_name: ${{ steps.vercel_provisioning.outputs.project_name }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Aprovisionamiento en Vercel (API)
        id: vercel_provisioning
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_TOKEN_SECRET }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || secrets.VERCEL_ORG_ID }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: bash .github/devsecops/scripts/vercel-provision.sh

  edge_firewall:
    name: 7. Firewall perimetral
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: vercel_provision
    if: ${{ success() && github.event_name == 'push' && needs.vercel_provision.outputs.project_id != '' }}
    outputs:
      middleware_generated: ${{ steps.edge_firewall.outputs.middleware_generated }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inyectar Edge Firewall corporativo
        id: edge_firewall
        shell: bash
        env:
          ALLOWED_CIDRS: ${{ vars.CORPORATE_ALLOWED_IPS || secrets.CORPORATE_ALLOWED_IPS || vars.ALLOWED_CIDRS || secrets.ALLOWED_CIDRS }}
        run: bash .github/devsecops/scripts/inject-edge-firewall.sh

      - name: Guardar middleware generado
        if: ${{ steps.edge_firewall.outputs.middleware_generated == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: corporate-generated-middleware
          path: middleware.js
          if-no-files-found: error
          retention-days: 1

  vercel_deploy:
    name: 8. Deploy Vercel produccion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - vercel_provision
      - edge_firewall
    if: ${{ success() && github.event_name == 'push' && needs.vercel_provision.outputs.project_id != '' }}
    outputs:
      deployment_url: ${{ steps.vercel_deploy.outputs.deployment_url }}
      project_id: ${{ steps.vercel_deploy.outputs.project_id }}
      project_name: ${{ steps.vercel_deploy.outputs.project_name }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar middleware generado
        if: ${{ needs.edge_firewall.outputs.middleware_generated == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: corporate-generated-middleware
          path: .

      - name: Despliegue en Vercel (Produccion)
        id: vercel_deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_TOKEN_SECRET }}
          RESOLVED_PROJECT_ID: ${{ needs.vercel_provision.outputs.project_id }}
          RESOLVED_PROJECT_NAME: ${{ needs.vercel_provision.outputs.project_name }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || secrets.VERCEL_ORG_ID }}
        run: bash .github/devsecops/scripts/vercel-deploy.sh

  env_redeploy:
    name: Redeploy por variables de entorno
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'redeploy-environment' }}
    permissions:
      contents: read

    steps:
      - name: Validar solicitud de redeploy
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          RESOLVED_PROJECT_ID: ${{ inputs.vercel_project_id }}
          RESOLVED_PROJECT_NAME: ${{ inputs.vercel_project_name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUEST_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::request_id invalido."
            exit 1
          fi
          if [[ ! "$RESOLVED_PROJECT_ID" =~ ^prj_[A-Za-z0-9]+$ ]]; then
            echo "::error::vercel_project_id invalido."
            exit 1
          fi
          if [[ ! "$RESOLVED_PROJECT_NAME" =~ ^[a-z0-9][a-z0-9._-]{0,99}$ ]]; then
            echo "::error::vercel_project_name invalido."
            exit 1
          fi
          normalized_project=$(printf '%s' "$RESOLVED_PROJECT_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')
          normalized_repository=$(printf '%s' "$REPOSITORY_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g')
          if [ "$normalized_project" != "$normalized_repository" ]; then
            echo "::error::El proyecto Vercel no corresponde a este repositorio."
            exit 1
          fi

      - name: Verificar identidad del proyecto en Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_TOKEN_SECRET }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || secrets.VERCEL_ORG_ID }}
          RESOLVED_PROJECT_ID: ${{ inputs.vercel_project_id }}
          RESOLVED_PROJECT_NAME: ${{ inputs.vercel_project_name }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_TEAM_ID" ]; then
            echo "::error::Faltan credenciales de Vercel para verificar el proyecto."
            exit 1
          fi
          project_payload=$(curl --silent --show-error --fail-with-body --get \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --data-urlencode "teamId=$VERCEL_TEAM_ID" \
            "https://api.vercel.com/v9/projects/$RESOLVED_PROJECT_ID")
          actual_project_name=$(printf '%s' "$project_payload" | jq -r '.name // empty')
          if [ "$actual_project_name" != "$RESOLVED_PROJECT_NAME" ]; then
            echo "::error::El Project ID no pertenece al nombre de proyecto solicitado."
            exit 1
          fi

      - name: Checkout de la rama principal
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inyectar Edge Firewall corporativo
        id: env_redeploy_firewall
        shell: bash
        env:
          ALLOWED_CIDRS: ${{ vars.CORPORATE_ALLOWED_IPS || secrets.CORPORATE_ALLOWED_IPS || vars.ALLOWED_CIDRS || secrets.ALLOWED_CIDRS }}
        run: bash .github/devsecops/scripts/inject-edge-firewall.sh

      - name: Pull, build y deploy de Production
        id: env_redeploy_deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_TOKEN_SECRET }}
          RESOLVED_PROJECT_ID: ${{ inputs.vercel_project_id }}
          RESOLVED_PROJECT_NAME: ${{ inputs.vercel_project_name }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || secrets.VERCEL_ORG_ID }}
        run: bash .github/devsecops/scripts/vercel-deploy.sh

      - name: Notificar redeploy exitoso
        if: ${{ success() }}
        shell: bash
        env:
          SECURITY_ALERT_WEBHOOK_URL: ${{ secrets.SECURITY_ALERT_WEBHOOK_URL }}
          SECURITY_ALERT_DEFAULT_TO: ${{ secrets.SECURITY_ALERT_DEFAULT_TO || vars.SECURITY_ALERT_DEFAULT_TO }}
          ALERT_TYPE: success
          ALERT_STATUS: Exitoso
          ALERT_REPOSITORY: ${{ github.repository }}
          ALERT_ACTOR: ${{ github.actor }}
          ALERT_WORKFLOW: ${{ github.workflow }}
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_REF: ${{ github.ref }}
          VERCEL_DEPLOYMENT_URL: ${{ steps.env_redeploy_deploy.outputs.deployment_url }}
          VERCEL_PROJECT_NAME: ${{ inputs.vercel_project_name }}
          VERCEL_PROJECT_ID: ${{ inputs.vercel_project_id }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || secrets.VERCEL_ORG_ID }}
        run: bash .github/devsecops/scripts/send-alert.sh

      - name: Notificar redeploy fallido
        if: ${{ failure() }}
        shell: bash
        env:
          SECURITY_ALERT_WEBHOOK_URL: ${{ secrets.SECURITY_ALERT_WEBHOOK_URL }}
          SECURITY_ALERT_DEFAULT_TO: ${{ secrets.SECURITY_ALERT_DEFAULT_TO || vars.SECURITY_ALERT_DEFAULT_TO }}
          ALERT_TYPE: error
          ALERT_STATUS: Fallido
          ALERT_REPOSITORY: ${{ github.repository }}
          ALERT_ACTOR: ${{ github.actor }}
          ALERT_WORKFLOW: ${{ github.workflow }}
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_REF: ${{ github.ref }}
          VERCEL_PROJECT_NAME: ${{ inputs.vercel_project_name }}
          VERCEL_PROJECT_ID: ${{ inputs.vercel_project_id }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || secrets.VERCEL_ORG_ID }}
        run: bash .github/devsecops/scripts/send-alert.sh

  notify_success:
    name: 9. Notificar exito
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - vercel_provision
      - vercel_deploy
    if: ${{ success() && github.event_name == 'push' && needs.vercel_deploy.result == 'success' && needs.vercel_provision.outputs.project_id != '' && needs.vercel_deploy.outputs.deployment_url != '' }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enviar alerta de exito
        shell: bash
        env:
          SECURITY_ALERT_WEBHOOK_URL: ${{ secrets.SECURITY_ALERT_WEBHOOK_URL }}
          SECURITY_ALERT_DEFAULT_TO: ${{ secrets.SECURITY_ALERT_DEFAULT_TO || vars.SECURITY_ALERT_DEFAULT_TO }}
          ALERT_TYPE: success
          ALERT_STATUS: Exitoso
          ALERT_REPOSITORY: ${{ github.repository }}
          ALERT_ACTOR: ${{ github.actor }}
          ALERT_WORKFLOW: ${{ github.workflow }}
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_REF: ${{ github.ref }}
          VERCEL_DEPLOYMENT_URL: ${{ needs.vercel_deploy.outputs.deployment_url }}
          VERCEL_PROJECT_NAME: ${{ needs.vercel_deploy.outputs.project_name || needs.vercel_provision.outputs.project_name }}
          VERCEL_PROJECT_ID: ${{ needs.vercel_deploy.outputs.project_id || needs.vercel_provision.outputs.project_id }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || secrets.VERCEL_ORG_ID }}
        run: bash .github/devsecops/scripts/send-alert.sh

  notify_failure:
    name: 10. Notificar error
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - preflight
      - secrets_scan
      - sast_scan
      - node_quality
      - rollback
      - vercel_provision
      - edge_firewall
      - vercel_deploy
    if: ${{ always() && (contains(join(needs.*.result, ','), 'failure') || contains(join(needs.*.result, ','), 'cancelled')) }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Alertar a Ciberseguridad si falla el workflow
        shell: bash
        env:
          SECURITY_ALERT_WEBHOOK_URL: ${{ secrets.SECURITY_ALERT_WEBHOOK_URL }}
          SECURITY_ALERT_DEFAULT_TO: ${{ secrets.SECURITY_ALERT_DEFAULT_TO || vars.SECURITY_ALERT_DEFAULT_TO }}
          ALERT_TYPE: error
          ALERT_STATUS: Fallido
          ALERT_REPOSITORY: ${{ github.repository }}
          ALERT_ACTOR: ${{ github.actor }}
          ALERT_WORKFLOW: ${{ github.workflow }}
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_REF: ${{ github.ref }}
          VERCEL_DEPLOYMENT_URL: ${{ needs.vercel_deploy.outputs.deployment_url }}
          VERCEL_PROJECT_NAME: ${{ needs.vercel_deploy.outputs.project_name || needs.vercel_provision.outputs.project_name }}
          VERCEL_PROJECT_ID: ${{ needs.vercel_deploy.outputs.project_id || needs.vercel_provision.outputs.project_id }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || secrets.VERCEL_ORG_ID }}
        run: bash .github/devsecops/scripts/send-alert.sh
