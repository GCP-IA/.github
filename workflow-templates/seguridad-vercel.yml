name: Corporate DevSecOps Gate

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: 1. Preflight y cambios
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_changed: ${{ steps.app_changes.outputs.changed }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bloquear archivos sensibles versionados
        shell: bash
        run: bash .github/devsecops/scripts/block-sensitive-files.sh

      - name: Detectar cambios de aplicacion
        id: app_changes
        shell: bash
        run: bash .github/devsecops/scripts/detect-app-changes.sh

  secrets_scan:
    name: 2. Secretos hardcodeados
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar reglas corporativas de secretos (Estricto / Multi-idioma)
        shell: bash
        run: bash .github/devsecops/scripts/prepare-gitleaks-config.sh

      - name: Escaneo de secretos hardcodeados (Gitleaks CLI)
        shell: bash
        env:
          WORKSPACE_PATH: ${{ github.workspace }}
        run: |
          docker run --rm \
            -v "$WORKSPACE_PATH:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git . --config .gitleaks-ci.toml --redact --verbose --exit-code 1

  sast_scan:
    name: 3. SAST Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: secrets_scan

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python para Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analisis estatico de seguridad (Semgrep SAST)
        shell: bash
        run: |
          python -m pip install --upgrade pipx
          pipx install semgrep
          semgrep scan \
            --config p/default \
            --config p/security-audit \
            --config p/secrets \
            --config p/javascript \
            --config p/nodejs \
            --error \
            --metrics=off

  node_quality:
    name: 4. Node.js SCA y calidad
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: sast_scan

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar sintaxis JavaScript
        shell: bash
        run: bash .github/devsecops/scripts/validate-js.sh

      - name: Auditoria de dependencias Node.js en Subcarpetas (SCA)
        shell: bash
        run: bash .github/devsecops/scripts/audit-node-deps.sh

      - name: Detectar dependencias no utilizadas en Subcarpetas
        shell: bash
        run: bash .github/devsecops/scripts/detect-unused-deps.sh

  rollback:
    name: 5. Rollback automatico
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - preflight
      - secrets_scan
      - sast_scan
      - node_quality
    if: ${{ always() && github.event_name == 'push' && contains(join(needs.*.result, ','), 'failure') }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rollback automatico en main
        shell: bash
        env:
          SHA_TO_REVERT: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: bash .github/devsecops/scripts/rollback.sh

  vercel_provision:
    name: 6. Vercel proyecto
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - preflight
      - node_quality
    if: ${{ success() && github.event_name == 'push' && needs.preflight.outputs.app_changed == 'true' }}
    outputs:
      project_id: ${{ steps.vercel_provisioning.outputs.project_id }}
      project_name: ${{ steps.vercel_provisioning.outputs.project_name }}
      team_id: ${{ steps.vercel_provisioning.outputs.team_id }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Aprovisionamiento en Vercel (API)
        id: vercel_provisioning
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_TOKEN_SECRET }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || secrets.VERCEL_ORG_ID }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: bash .github/devsecops/scripts/vercel-provision.sh

  edge_firewall:
    name: 7. Firewall perimetral
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: vercel_provision
    if: ${{ success() && github.event_name == 'push' && needs.vercel_provision.outputs.project_id != '' }}
    outputs:
      middleware_generated: ${{ steps.edge_firewall.outputs.middleware_generated }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inyectar Edge Firewall corporativo
        id: edge_firewall
        shell: bash
        run: bash .github/devsecops/scripts/inject-edge-firewall.sh

      - name: Guardar middleware generado
        if: ${{ steps.edge_firewall.outputs.middleware_generated == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: gcp-td-generated-middleware
          path: middleware.js
          if-no-files-found: error
          retention-days: 1

  vercel_deploy:
    name: 8. Deploy Vercel produccion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - vercel_provision
      - edge_firewall
    if: ${{ success() && github.event_name == 'push' && needs.vercel_provision.outputs.project_id != '' }}
    outputs:
      deployment_url: ${{ steps.vercel_deploy.outputs.deployment_url }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar middleware generado
        if: ${{ needs.edge_firewall.outputs.middleware_generated == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: gcp-td-generated-middleware
          path: .

      - name: Despliegue en Vercel (Produccion)
        id: vercel_deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_TOKEN_SECRET }}
          RESOLVED_PROJECT_ID: ${{ needs.vercel_provision.outputs.project_id }}
          VERCEL_TEAM_ID: ${{ needs.vercel_provision.outputs.team_id }}
        run: bash .github/devsecops/scripts/vercel-deploy.sh

  notify_success:
    name: 9. Notificar exito
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - vercel_provision
      - vercel_deploy
    if: ${{ success() && github.event_name == 'push' && needs.vercel_deploy.outputs.deployment_url != '' }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enviar alerta de exito
        shell: bash
        env:
          SECURITY_ALERT_WEBHOOK_URL: ${{ secrets.SECURITY_ALERT_WEBHOOK_URL }}
          ALERT_TYPE: success
          ALERT_STATUS: Exitoso
          ALERT_REPOSITORY: ${{ github.repository }}
          ALERT_ACTOR: ${{ github.actor }}
          ALERT_WORKFLOW: ${{ github.workflow }}
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_REF: ${{ github.ref }}
          VERCEL_DEPLOYMENT_URL: ${{ needs.vercel_deploy.outputs.deployment_url }}
          VERCEL_PROJECT_NAME: ${{ needs.vercel_provision.outputs.project_name }}
          VERCEL_PROJECT_ID: ${{ needs.vercel_provision.outputs.project_id }}
          VERCEL_TEAM_ID: ${{ needs.vercel_provision.outputs.team_id }}
        run: bash .github/devsecops/scripts/send-alert.sh

  notify_failure:
    name: 10. Notificar error
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - preflight
      - secrets_scan
      - sast_scan
      - node_quality
      - rollback
      - vercel_provision
      - edge_firewall
      - vercel_deploy
    if: ${{ always() && contains(join(needs.*.result, ','), 'failure') }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Alertar a Ciberseguridad si falla el workflow
        shell: bash
        env:
          SECURITY_ALERT_WEBHOOK_URL: ${{ secrets.SECURITY_ALERT_WEBHOOK_URL }}
          ALERT_TYPE: error
          ALERT_STATUS: Fallido
          ALERT_REPOSITORY: ${{ github.repository }}
          ALERT_ACTOR: ${{ github.actor }}
          ALERT_WORKFLOW: ${{ github.workflow }}
          ALERT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_REF: ${{ github.ref }}
          VERCEL_DEPLOYMENT_URL: ${{ needs.vercel_deploy.outputs.deployment_url }}
          VERCEL_PROJECT_NAME: ${{ needs.vercel_provision.outputs.project_name }}
          VERCEL_PROJECT_ID: ${{ needs.vercel_provision.outputs.project_id }}
          VERCEL_TEAM_ID: ${{ needs.vercel_provision.outputs.team_id }}
        run: bash .github/devsecops/scripts/send-alert.sh
